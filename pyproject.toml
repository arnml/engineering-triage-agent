[project]
name = "engineering-triage-agent"
version = "0.1.0"
description = "Starter LangGraph prototype for evidence-based application incident triage"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "langchain-openai>=0.2,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
triage-agent = "triage_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triage_agent*"]
